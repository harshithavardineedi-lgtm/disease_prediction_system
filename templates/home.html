<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>AI Health Predict</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">

</head>

<body>

    <!-- Animated Background -->

    <div class="background">

        <div class="glow glow-one"></div>
        <div class="glow glow-two"></div>
        <div class="grid"></div>

    </div>


    <div class="page">


        <!-- ================= NAVBAR ================= -->

        <header class="navbar">

            <div class="brand">

                <div class="brand-icon">
                    ✦
                </div>

                <div>

                    <span class="brand-small">
                        AI HEALTH
                    </span>

                    <span class="brand-name">
                        PREDICT
                    </span>

                </div>

            </div>


            <nav>

                <a href="/" class="active">
                    HOME
                </a>

                <a href="/prediction">
                    PREDICTION
                </a>

            </nav>


            <div class="status">

                <span class="status-dot"></span>

                AI SYSTEM ONLINE

            </div>

        </header>



        <!-- ================= HERO ================= -->

        <section class="home-hero">


            <!-- LEFT CONTENT -->

            <div class="home-content">

                <div class="eyebrow">

                    <span>✦</span>

                    AI • HEALTH ANALYTICS

                </div>


                <h1>

                    AI-BASED

                    <span>
                        DISEASE
                    </span>

                    PREDICTION

                </h1>


                <p>

                    Intelligent symptom analysis
                    powered by machine learning.

                </p>


                <a href="/prediction"
                   class="predict-button">

                    <span>✦</span>

                    START PREDICTION

                    <span>→</span>

                </a>


                <!-- STATS -->

                <div class="home-stats">


                    <div class="home-stat">

                        <strong>
                            75%
                        </strong>

                        <span>
                            MODEL ACCURACY
                        </span>

                    </div>


                    <div class="stat-divider"></div>


                    <div class="home-stat">

                        <strong>
                            5
                        </strong>

                        <span>
                            DISEASE CLASSES
                        </span>

                    </div>


                    <div class="stat-divider"></div>


                    <div class="home-stat">

                        <strong>
                            7
                        </strong>

                        <span>
                            SYMPTOMS
                        </span>

                    </div>

                </div>

            </div>



            <!-- ================= AI VISUAL ================= -->

            <div class="home-visual">

                <div class="orb-ring ring-one"></div>

                <div class="orb-ring ring-two"></div>

                <div class="orb-ring ring-three"></div>


                <div class="ai-orb">

                    <div class="orb-core">
                        ✦
                    </div>

                </div>


                <div class="orbit-dot dot-one"></div>

                <div class="orbit-dot dot-two"></div>

                <div class="orbit-dot dot-three"></div>

            </div>


        </section>



        <!-- ================= FOOTER ================= -->

        <footer>

            <div>
                AI HEALTH PREDICT
            </div>

            <span>
                MACHINE LEARNING PROJECT • 2026
            </span>

        </footer>


    </div>

</body>

</html>
